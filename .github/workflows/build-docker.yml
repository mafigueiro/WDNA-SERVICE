name: build-docker
run-name: Build Docker image

on:
  workflow_run:
    workflows:
      - python-testing
    branches:
      - main
      - develop
    types:
      - completed

jobs:
  docker-build:
    runs-on: [SI, standard]
    if: ${{ ! github.event.repository.isTemplate }}

    steps:
      - uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: harbor.gradiant.org/si-medeva-pr-01432
          username: ${{ secrets.HarborUser }}
          password: ${{ secrets.HarborPass }}
          # Log out from the Docker registry at the end of a job
          logout: true

      - name: Extract Branch name
        run: echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_ENV

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: harbor.gradiant.org/si-medeva-pr-01432/SchemaMatchingModule:${{ env.BRANCH }}
          build-args: |
            BRANCH=${{ env.BRANCH }}
