repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black
        language: system
        types:
          - file
          - python
  - repo: local
    hooks:
      - id: flake8
        name: flake8
        entry: uv run flake8
        language: system
        types:
          - file
          - python
  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: uv run isort
        language: system
        types:
          - file
          - python
